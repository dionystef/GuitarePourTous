name: Build Windows (NSIS & Portable)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, Windows]
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Clean previous build artifacts
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "dist-portable", "dist", "guitarlab-windows-portable.zip"

      - name: Setup ffmpeg / ffprobe
        run: |
          $cacheDir = "$env:USERPROFILE\.guitarlab-cache\bin"
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          if (-not (Test-Path "$cacheDir/ffmpeg.exe") -or -not (Test-Path "$cacheDir/ffprobe.exe")) {
            Write-Host "Téléchargement initial de FFmpeg vers le cache ($cacheDir)..."
            $base = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest"
            $archive = "$env:TEMP\ffmpeg-latest-win64.zip"
            Invoke-WebRequest -UseBasicParsing -Uri "$base/ffmpeg-master-latest-win64-gpl.zip" -OutFile "$archive"
            Expand-Archive -Path "$archive" -DestinationPath "$env:TEMP\ffmpeg-extract" -Force
            $ffdir = Get-ChildItem -Path "$env:TEMP\ffmpeg-extract" -Directory | Select-Object -First 1
            Copy-Item -Force "$($ffdir.FullName)/bin/ffmpeg.exe" "$cacheDir/ffmpeg.exe"
            Copy-Item -Force "$($ffdir.FullName)/bin/ffprobe.exe" "$cacheDir/ffprobe.exe"
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$env:TEMP\ffmpeg-extract", "$archive"
          } else {
            Write-Host "FFmpeg trouvé dans le cache local ($cacheDir) : aucun téléchargement nécessaire."
          }

          $binDir = "src-tauri/resources/bin"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          Copy-Item -Force "$cacheDir/ffmpeg.exe" "$binDir/ffmpeg.exe"
          Copy-Item -Force "$cacheDir/ffprobe.exe" "$binDir/ffprobe.exe"

      - name: Install PyTorch CPU (Windows)
        run: python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Install engine prerequisites
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Installation requirements.txt en echec (ex: extensions C madmom), installation directe des paquets du labo..."
            python -m pip install fastapi uvicorn[standard] python-multipart "anyio>=3.7.1,<5" numpy scipy soundfile librosa demucs basic-pitch mido yt-dlp faster-whisper
          }
          python -m pip install pyinstaller
          python -c "import anyio, fastapi, uvicorn; print('Verification modules OK : AnyIO, FastAPI, Uvicorn sont bien installes')"

      - name: Build engine with PyInstaller
        run: python -m PyInstaller --clean guitarlab-engine.spec

      - name: Copy engine into Tauri resources
        run: |
          $dest = "src-tauri/resources/engine"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Recurse -Force "dist/guitarlab-engine/*" $dest

      - name: Build Tauri bundle (NSIS)
        run: npx @tauri-apps/cli build --bundles nsis

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: guitarlab-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Package Portable version (ZIP)
        run: |
          $portableDir = "dist-portable/GuitarLab-Portable"
          New-Item -ItemType Directory -Force -Path "$portableDir/data" | Out-Null
          New-Item -ItemType File -Force -Path "$portableDir/.portable" | Out-Null

          # Récupération de l'exécutable Tauri compilé
          $exe = Get-ChildItem -Path "src-tauri/target/release" -Filter "*.exe" -File | Where-Object { $_.Name -like "*Guitar*Lab*.exe" -or $_.Name -like "*guitar-lab*.exe" } | Select-Object -First 1
          if (-not $exe) { throw "Exécutable Tauri introuvable dans src-tauri/target/release" }
          Write-Host "Binaire Tauri trouvé : $($exe.FullName)"
          Copy-Item -Force $exe.FullName "$portableDir/Guitar Lab.exe"

          # Copie des ressources embarquées (engine PyInstaller + ffmpeg)
          Copy-Item -Recurse -Force "src-tauri/resources" "$portableDir/resources"

          # Création de l'archive ZIP portable
          Compress-Archive -Path "$portableDir" -DestinationPath "guitarlab-windows-portable.zip" -Force
          Write-Host "Archive portable créée avec succès : guitarlab-windows-portable.zip"

      - name: Upload Portable package
        uses: actions/upload-artifact@v4
        with:
          name: guitarlab-windows-portable
          path: guitarlab-windows-portable.zip
          if-no-files-found: error
