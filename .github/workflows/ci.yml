name: CI Tests (Proxmox Self-Hosted)

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted
    container:
      image: python:3.10-slim

    steps:
      - name: Dépendances système (Audio, C Compiler, Git, Node.js)
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            build-essential \
            git \
            curl \
            nodejs \
            libsndfile1 \
            ffmpeg
          rm -rf /var/lib/apt/lists/*

      - name: Checkout
        uses: actions/checkout@v4

      - name: Préparer le cache Pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Outils de build Python & PyTorch CPU
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools<70" wheel Cython numpy==1.26.4
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Installer les dépendances du projet
        run: |
          pip install --no-build-isolation -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Exécuter Pytest
        run: pytest

      - name: Exécuter les tests JS
        run: node tests/js/resume.test.js
