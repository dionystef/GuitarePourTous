name: CI Tests & Déploiement Proxmox

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Exécuter les tests dans le conteneur local
        run: |
          docker run --rm --pull never \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$GITHUB_WORKSPACE:/app" \
            -w /app \
            guitare-ci:latest \
            sh -c "pytest && node tests/js/resume.test.js && node tests/js/folders.test.js && node tests/js/library_folders.test.js && node tests/js/ui_redesign.test.js"

  deploy:
    needs: test
    runs-on: self-hosted
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'

    steps:
      - name: Déployer sur le conteneur LXC GuitareLab (192.168.1.107)
        run: |
          ssh -o StrictHostKeyChecking=accept-new root@192.168.1.107 "cd /opt/guitarlab && git checkout master && git pull origin master && docker compose up -d --force-recreate"
