<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Guitar Lab — démarrage</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, sans-serif; background: #0b0e14; color: #dbe3f0; text-align: center;
    }
    .box { max-width: 760px; padding: 24px; }
    .sp {
      width: 40px; height: 40px; border: 4px solid #262e3f; border-top-color: #8b7bff;
      border-radius: 50%; animation: sp 1s linear infinite; margin: 0 auto 18px;
    }
    @keyframes sp { to { transform: rotate(360deg); } }
    h1 { margin: 0 0 10px; font-size: 22px; }
    p { margin: 0; color: #8b96ad; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="box">
    <div class="sp"></div>
    <h1>Guitar Lab</h1>
    <p>Le moteur de traitement démarre…<br />
      Si cette page reste affichée, vérifiez que le backend Python est lancé.</p>
    <div id="log-box" style="
      margin-top: 20px;
      background: #05070a;
      border: 1px solid #1e2638;
      border-radius: 8px;
      padding: 12px;
      text-align: left;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 12px;
      color: #94a3b8;
      max-height: 220px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    ">
      <div style="color: #64748b;">[Attente du démarrage du moteur…]</div>
    </div>
  </div>
  <script>
    window.__addLog = function(msg) {
      const box = document.getElementById('log-box');
      if (!box) return;
      const line = document.createElement('div');
      line.style.marginTop = '4px';
      line.textContent = msg;
      if (msg.includes('ERROR') || msg.includes('Error') || msg.includes('Traceback') || msg.includes('❌')) {
        line.style.color = '#ef4444';
        line.style.fontWeight = 'bold';
      } else if (msg.includes('SUCCESS') || msg.includes('prêt') || msg.includes('Uvicorn running')) {
        line.style.color = '#22c55e';
      }
      box.appendChild(line);
      box.scrollTop = box.scrollHeight;
    };
  </script>
</body>
</html>
